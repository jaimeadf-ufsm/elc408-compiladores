  - id: "3717089416749"
    alias: "Condições de estado e numéricas"
    mode: "single"
    triggers:
      - trigger: state
        entity_id: binary_sensor.sala
        to: "on"
    conditions:
      - condition: state
        entity_id: light.sala
        state: "on"
      - not:
          - condition: state
            entity_id: climate.casa
            state: "off"
      - condition: numeric_state
        entity_id: sensor.temperatura
        below: 28
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.umidificador
  - id: "3173465638456"
    alias: "Condições de horário e dia"
    mode: "single"
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: time
        after: "06:00:00"
      - condition: time
        before: "23:00:00"
      - condition: time
        after: "08:00:00"
        before: "22:00:00"
      - condition: time
        weekday:
          - "mon"
          - "tue"
          - "wed"
          - "thu"
          - "fri"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.escritorio
  - id: "8295329391579"
    alias: "Condições solares e operadores"
    mode: "single"
    triggers:
      - trigger: state
        entity_id: binary_sensor.sala
        to: "on"
        id: "movimento"
    conditions:
      - condition: sun
        after: sunset
        before: sunrise
      - not:
          - condition: state
            entity_id: light.sala
            state: "on"
      - condition: trigger
        id: "movimento"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.sala