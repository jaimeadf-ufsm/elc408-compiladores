  - id: "1780950852"
    alias: "Luz Sala"
    description: "Ligar a luz quando ha movimento ou ao anoitecer"
    mode: "restart"
    triggers:
      - trigger: state
        entity_id: binary_sensor.sala
        to: "on"
        id: "movimento"
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
        id: "anoitecer"
    conditions:
      - condition: sun
        after: sunset
        before: sunrise
      - condition: state
        entity_id: alarm_control_panel.casa
        state: "disarmed"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.sala
        data:
          rgb_color:
            - 255
            - 150
            - 60
          transition: 2
      - if:
          - condition: trigger
            id: "movimento"
        then:
          - delay: "00:05:00"
          - action: light.turn_off
            target:
              entity_id: light.sala
        else:
          - action: tts.speak
            target:
              entity_id: tts.sala
            data:
              media_player_entity_id: media_player.sala
              message: "Bom anoitecer"