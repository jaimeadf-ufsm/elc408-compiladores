  - alias: "Por do Sol"
    description: "Liga dispositivos em horários diferentes dependendo do clima (Chuva:
      -1h30, Nublado: -1h15, Sol: -45min)"
    mode: "single"
    triggers:
      - trigger: sun
        event: sunset
        offset: "-01:30:00"
        id: "chuva"
      - trigger: sun
        event: sunset
        offset: "-01:15:00"
        id: "nublado"
      - trigger: sun
        event: sunset
        offset: "-00:45:00"
        id: "sol"
    conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: "disarmed"
    actions:
      - if:
          - or:
              - condition: state
                entity_id: weather.forecast_casa
                state: "rainy"
              - condition: state
                entity_id: weather.forecast_casa
                state: "pouring"
              - condition: state
                entity_id: weather.forecast_casa
                state: "lightning-rainy"
              - condition: state
                entity_id: weather.forecast_casa
                state: "hail"
              - condition: state
                entity_id: weather.forecast_casa
                state: "snowy"
        then:
          - action: automation.trigger
            target:
              entity_id: automation.cozinha_ligar_luzes
            data:
              skip_condition: true
        else:
          - if:
              - or:
                  - condition: state
                    entity_id: weather.forecast_casa
                    state: "cloudy"
                  - condition: state
                    entity_id: weather.forecast_casa
                    state: "windy-variant"
                  - condition: state
                    entity_id: weather.forecast_casa
                    state: "fog"
                  - condition: state
                    entity_id: weather.forecast_casa
                    state: "partlycloudy"
                  - condition: state
                    entity_id: weather.forecast_casa
                    state: "windy"
              - condition: state
                entity_id: switch.eff060
                state: "off"
            then:
              - action: automation.trigger
                target:
                  entity_id: automation.cozinha_ligar_luzes
                data:
                  skip_condition: true
            else:
              - if:
                  - condition: trigger
                    id: "sol"
                then:
                  - action: automation.trigger
                    target:
                      entity_id: automation.cozinha_ligar_luzes
                    data:
                      skip_condition: true