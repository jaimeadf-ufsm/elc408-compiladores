  - alias: "Sala - Movimento"
    mode: "restart"
    triggers:
      - trigger: state
        entity_id: timer.sala
        to: "idle"
        id: "Movimento_ocioso"
      - trigger: state
        entity_id: binary_sensor.sala_motion_sensor
        to: "on"
        id: "Movimento"
      - trigger: state
        entity_id: binary_sensor.cozinha_motion_sensor_movimento_2
        to: "on"
        id: "CozinhaMovimento"
      - trigger: state
        entity_id: binary_sensor.sala_motion_sensor
        to: "off"
        id: "Liberado"
      - trigger: state
        entity_id: binary_sensor.corredor_motion_sensor_pro_movimento
        to: "on"
        id: "Movimento Pro"
      - trigger: state
        entity_id: binary_sensor.corredor_motion_sensor_pro_movimento
        to: "off"
        id: "Liberado"
      - trigger: state
        entity_id: light.luzes_da_sala
        from: "on"
        id: "Luzes ligada"
    conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: "disarmed"
    actions:
      - if:
          - or:
              - condition: trigger
                id: "Movimento"
              - condition: trigger
                id: "CozinhaMovimento"
              - condition: trigger
                id: "Movimento Pro"
        then:
          - action: "timer.start"
            target:
              entity_id: timer.sala
          - if:
              - condition: state
                entity_id: switch.sonoff_10018dee48_3
                state: "on"
              - condition: state
                entity_id: alarm_control_panel.37dc24
                state: "disarmed"
              - condition: state
                entity_id: switch.luzes_da_sala
                state: "off"
              - condition: state
                entity_id: media_player.eea259
                state: "off"
              - condition: sun
                after: sunset
                before: sunrise
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10021a5971_2
              - delay: "00:03:00"
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10021a5971_2
      - action: media_player.volume_set
        target:
          entity_id: media_player.music_frame
        data:
          volume_level: 0.09
      - if:
          - condition: trigger
            id: "Movimento_ocioso"
        then:
          - action: media_player.volume_set
            target:
              entity_id: media_player.music_frame_2
            data:
              volume_level: 0.11
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_1002036351_1
          - action: tts.speak
            target:
              entity_id: tts.google_en_com
            data:
              media_player_entity_id: media_player.music_frame_2
              message: "Atenção! As luzes da sala serão desligadas em 1 minuto! Ligue
                alguma luz ou se movimente."
              language: "pt"
          - delay: "00:01:00"
          - action: tts.speak
            target:
              entity_id: tts.google_en_com
            data:
              media_player_entity_id: media_player.music_frame_2
              message: "Atenção! As luzes da sala serão desligadas em 1 minuto! Ligue
                alguma luz ou se movimente."
              language: "pt"
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_1002036186_2
          - delay: "00:01:00"
          - action: switch.turn_off
            target:
              entity_id: switch.luzes_da_sala
          - action: "alexa_devices.send_text_command"
            data:
              device_id: "38496a"
              text_command: "desligar tela"
      - if:
          - condition: trigger
            id: "Liberado"
        then:
          - action: timer.start
            target:
              entity_id: timer.sala