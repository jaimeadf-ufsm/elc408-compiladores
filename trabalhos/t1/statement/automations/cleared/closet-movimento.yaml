- id: '1723755786962'
  alias: Closet - Movimento
  description: ''
  triggers:
    - trigger: state
      entity_id: timer.closet
      to: idle
      id: Ocioso
    - trigger: state
      entity_id: timer.closet
      to: active
      id: Movimento
    - trigger: state
      entity_id: binary_sensor.1e1e19
      to: "on"
      id: Detectou
  conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
    - if:
        - condition: trigger
          id:
            - Movimento
            - Detectou
      then:
        - action: timer.start
          target:
            entity_id: timer.closet
        - if:
            - condition: state
              entity_id: switch.bb97c4
              state: "off"
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.e6bd5f
    - if:
        - condition: trigger
          id:
            - Ocioso
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.e6bd5f
  mode: restart
