[project]
name = "jass"
version = "0.1.0"
description = "A DSL that transpiles to Home Assistant automation YAML"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lark>=1.1",
    "python-slugify>=8.0.4",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
jass = "jass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jass"]

[tool.hatch.build.targets.wheel.force-include]
"src/jass/grammar.lark" = "jass/grammar.lark"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
